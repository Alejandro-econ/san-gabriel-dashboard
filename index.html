<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}.natpdf{width:min(1000px,100%);border:0;background:#fff;border-radius:6px;box-shadow:0 14px 30px -18px rgba(21,30,50,.45);display:block}.natlink{display:block;text-align:center;margin:8px auto;font-size:.9rem;color:inherit;opacity:.8}
</style></head><body>
<title>Riesgo San Gabriel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: portada blanca con la imagen en un círculo grande y el título debajo → al presionar, el mapa contada como relato, con un mapa que abre la ubicación real → resultados de la simulación, donde se elige el escenario y la moneda. */
:root{
  --bg:#ffffff; --ink:#15181e; --muted:#6c7380; --line:#e6e8ec; --soft:#f5f6f8; --gold:#24406b; --gold-soft:#e6ecf5;
  --blue:#2463b8; --blue-soft:#e8f0fb; --red:#c0392b; --red-soft:#fbe7e4; --green:#23825a;
  --display:'Outfit',system-ui,sans-serif; --read:'Source Serif 4',Georgia,serif; --mono:'JetBrains Mono',ui-monospace,monospace; --serif:'Cormorant Garamond','Source Serif 4',Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--display);margin:0}
#app{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr)}
#app>.cover{height:100%}
#app>.mapstage{height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:12px}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@keyframes rise{from{opacity:.001;transform:translateY(16px)}}
@keyframes zoomin{from{opacity:.001;transform:scale(.9)}}

/* ---------- portada (una sola pantalla) ---------- */
.cover{position:relative;height:100%;min-height:560px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:center;gap:clamp(20px,4vw,64px);padding-block:clamp(20px,4vh,40px);padding-left:max(clamp(16px,5vw,72px),env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cover::before{content:"";position:absolute;left:-12vmin;top:50%;width:min(86vh,58vw);aspect-ratio:1;transform:translateY(-50%);border-radius:50%;border:1px solid var(--line);pointer-events:none}
.circle-wrap{position:relative;justify-self:center;display:grid;justify-items:center;gap:16px}
.circle{position:relative;display:block;width:min(68vh,40vw);aspect-ratio:1;border-radius:50%;overflow:hidden;animation:zoomin 1.1s cubic-bezier(.2,.7,.2,1) both;box-shadow:0 30px 60px -34px rgba(20,24,30,.6)}
.circle img{width:100%;height:100%;object-fit:cover;object-position:62% 50%;display:block;transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
.circle:hover img{transform:scale(1.06)}
.circle::before{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 7px rgba(255,255,255,.92);z-index:1;pointer-events:none}
.cue{display:inline-flex;align-items:center;gap:10px;font-size:.86rem;color:var(--muted);animation:rise .9s cubic-bezier(.2,.7,.2,1) .5s both}
.cue i{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-style:normal;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(36,64,107,.12)}}
.ttl{display:grid;gap:clamp(10px,2vh,18px);align-content:center;min-width:0}
.ttl>*{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.ttl>*:nth-child(2){animation-delay:.1s}.ttl>*:nth-child(3){animation-delay:.2s}.ttl>*:nth-child(4){animation-delay:.3s}.ttl>*:nth-child(5){animation-delay:.4s}
.t-title{font-family:var(--serif);font-weight:500;font-size:clamp(1.9rem,5.2vh,3.1rem);line-height:1.12;letter-spacing:-.01em;color:var(--ink);margin:0;max-width:22ch;text-wrap:balance}
.t-title em{font-style:normal}
.t-en{font-family:var(--serif);font-style:italic;font-size:clamp(.92rem,2vh,1.12rem);line-height:1.45;color:var(--muted);margin:0;max-width:44ch;padding-top:clamp(8px,1.6vh,14px);border-top:1px solid var(--line)}
.author{position:absolute;top:max(18px,env(safe-area-inset-top,0px));right:max(22px,env(safe-area-inset-right,0px));font-family:var(--serif);font-size:.95rem;font-weight:500;letter-spacing:.04em;color:var(--muted);animation:rise 1s cubic-bezier(.2,.7,.2,1) .5s both}
@media (max-width:860px){
 .cover{height:auto;min-height:100%;grid-template-columns:1fr;justify-items:center;text-align:left;gap:18px;padding-block:52px 28px}
 .cover::before{display:none}
 .circle{width:min(62vw,36vh)}
 .ttl{justify-items:start;width:100%}
 .t-title{font-size:clamp(1.7rem,7.4vw,2.2rem)}
}

/* ---------- mapa ---------- */
.mapstage{position:relative;height:100%;min-height:520px;overflow:hidden;background:#c9dded;display:grid;grid-template-columns:minmax(0,1fr) 0px;grid-template-rows:minmax(0,1fr);transition:grid-template-columns .9s cubic-bezier(.2,.7,.2,1)}
.mapstage.zoomed{grid-template-columns:minmax(0,1fr) min(480px,44vw)}
#mapsvg{width:100%;height:100%;min-height:0;display:block;cursor:zoom-in;outline:none}
.mapstage.zoomed #mapsvg{cursor:default}
.grat{stroke:#ffffff;stroke-opacity:.45;stroke-width:1.2;vector-effect:non-scaling-stroke}
.nbf{fill:#eef0ec}
.nb{fill:#eef0ec;stroke:#eef0ec;stroke-width:7;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.pe{fill:#f4efe2}
.pe-line{fill:none;stroke:#6f6a5e;stroke-width:1.4;vector-effect:non-scaling-stroke}
.lake{fill:#a9c9e2;stroke:#8fb2cf;stroke-width:1;vector-effect:non-scaling-stroke}
.country{font-family:var(--display);font-size:30px;letter-spacing:.3em;fill:#8a8f88;font-weight:600}
.ocean{font-family:var(--serif);font-style:italic;font-size:44px;fill:#6f8ea8;letter-spacing:.05em}
.peru-lab{font-family:var(--serif);font-size:84px;letter-spacing:.35em;fill:#5d584c;opacity:.55}
.cdot{fill:#3a3f47}
.clab{font-family:var(--display);font-size:9px;fill:#2e333a}
.flc .clab{font-size:30px}.flc .cdot{r:9px}
.zcountry{font-family:var(--display);font-size:10px;letter-spacing:.3em;fill:#7d8279;font-weight:600}
.zlake{font-family:var(--serif);font-style:italic;font-size:10px;fill:#4f7596}
.scale{stroke:#2e333a;stroke-width:1.4;vector-effect:non-scaling-stroke}.scalet{font-family:var(--display);font-size:8px;fill:#2e333a}
.fl,.zl-all,.mglow{transition:opacity .7s}
.zl-all{opacity:0}.zoomed .zl-all{opacity:1}.zoomed .fl{opacity:0}
.mglow{opacity:.9}
.pdot{fill:#24406b;stroke:#fff;stroke-width:2.5;vector-effect:non-scaling-stroke}
.ping{fill:none;stroke:#24406b;stroke-width:2;vector-effect:non-scaling-stroke;animation:ping2 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping2{from{transform:scale(.4);opacity:1}to{transform:scale(2.4);opacity:0}}
.pin{transform-box:fill-box}
.mlab{font-family:var(--serif);font-size:14px;font-weight:600;fill:#14181f}.msub{font-family:var(--display);font-size:7.5px;fill:#3a3f47}
.mapback{position:absolute;top:max(14px,env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));z-index:3;width:48px;height:48px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px #fff,0 8px 18px -8px rgba(0,0,0,.5)}
.mapback img{width:100%;height:100%;object-fit:cover;object-position:62% 50%}
.maphint{position:absolute;left:50%;bottom:max(22px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:3;background:rgba(255,255,255,.92);padding:10px 18px;border-radius:999px;font-size:.92rem;box-shadow:0 8px 22px -12px rgba(0,0,0,.45);white-space:nowrap;animation:breathe 2.4s ease-in-out infinite}
.maphint:empty{display:none}
@keyframes breathe{50%{opacity:.6}}
.mapcard{background:#fff;overflow:auto;padding:26px 28px;display:grid;gap:12px;align-content:safe center;grid-auto-rows:max-content;opacity:0;transform:translateX(30px);transition:opacity .6s .5s,transform .6s .5s;min-width:0}
.zoomed .mapcard{opacity:1;transform:none}
.mapcard dl{margin:0;display:grid}
.mapcard dl div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.mapcard dt{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.mapcard dd{margin:0;font-size:.95rem}
.mcbtns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ghost{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;cursor:pointer;font-size:.9rem}
@media (max-width:760px){.mapstage{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 0}.mapstage.zoomed{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}.mapcard{padding:18px 16px;max-height:58vh}}

.satbox{position:relative;aspect-ratio:16/10;flex:none;border-radius:14px;overflow:hidden;background:#3b3a33}
.sv{position:absolute;inset:0;opacity:0;transition:opacity .9s ease}
.sv.on{opacity:1}
.sv img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.08);transition:transform 9s ease-out}
.sv.on img{transform:scale(1)}
.satmark{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
.satmark i{display:block;width:16px;height:16px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.3);animation:satp 2s ease-out infinite}
@keyframes satp{0%{box-shadow:0 0 0 0 rgba(255,255,255,.85)}100%{box-shadow:0 0 0 16px rgba(255,255,255,0)}}
.satscale{position:absolute;right:12px;bottom:12px;display:grid;justify-items:center;gap:3px;font-family:var(--display);font-size:.7rem;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.satscale i{display:block;height:5px;width:100%;border:2px solid #fff;border-top:0}
.attr{position:absolute;left:10px;bottom:8px;font-size:.6rem;color:rgba(255,255,255,.85);text-shadow:0 1px 3px rgba(0,0,0,.8)}
.views{display:flex;gap:2px;background:var(--soft);border-radius:10px;padding:3px}
.views button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:8px;font-size:.84rem;color:var(--ink);opacity:.6;cursor:pointer}
.views button[aria-pressed="true"]{background:#fff;opacity:1;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.facts2{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:8px;font-family:var(--serif);font-size:1.12rem;color:var(--ink)}
.facts2 li{padding-bottom:8px;border-bottom:1px solid var(--line)}
.mc-kick{font-family:var(--display);font-size:.72rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.mapcard h2{font-family:var(--serif);font-weight:500;font-size:2.4rem;line-height:1;margin:-4px 0 0}
.mc-sub{margin:-6px 0 4px;font-family:var(--serif);font-style:italic;font-size:1.1rem;color:var(--gold)}
.mc-dl{margin:2px 0 0;display:grid}
.mc-dl div{display:grid;grid-template-columns:132px minmax(0,1fr);gap:12px;padding:7px 0;border-bottom:1px solid var(--line);align-items:baseline}
.mc-dl div:first-child{border-top:1px solid var(--line)}
.mc-dl dt{font-family:var(--display);font-size:.7rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.mc-dl dd{margin:0;font-family:var(--serif);font-size:1.05rem;color:var(--ink);line-height:1.3}
/* ---------- barra ---------- */
.top{display:flex;align-items:center;gap:14px;padding-block:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mini{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none}
.mini img{width:100%;height:100%;object-fit:cover;object-position:62% 50%;display:block}
.crumbs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.crumbs a{font-size:.82rem;color:var(--muted);text-decoration:none;padding:7px 12px;border-radius:8px;white-space:nowrap}
.crumbs a:hover{background:var(--soft);color:var(--ink)}
.crumbs a.on{background:var(--ink);color:var(--bg)}

/* ---------- relato ---------- */
.story{max-width:760px;margin:0 auto;animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.story-head{padding-block:44px 20px;display:grid;gap:10px}
.kicker{font-family:var(--mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.story-head h1{font-weight:600;font-size:clamp(1.9rem,4.4vw,3rem);line-height:1.08;letter-spacing:-.02em;margin:0;text-wrap:balance}
.lede{font-family:var(--read);font-size:clamp(1.1rem,1.8vw,1.3rem);line-height:1.6;color:var(--muted);margin:0}
.chapter{position:relative;padding-block:22px;border-top:1px solid var(--line)}
.chapter .when{font-family:var(--mono);font-size:.76rem;color:var(--gold);letter-spacing:.08em;display:block;margin-bottom:6px}
.chapter h2{font-weight:600;font-size:clamp(1.2rem,2.2vw,1.5rem);margin:0 0 10px;letter-spacing:-.01em}
.chapter p{font-family:var(--read);font-size:1.1rem;line-height:1.75;margin:0 0 14px}
.chapter p:last-child{margin-bottom:0}
.chapter strong{font-weight:600;background:linear-gradient(transparent 62%,var(--gold-soft) 62%)}
@media (min-width:1040px){.chapter .when{position:absolute;left:-150px;top:28px;width:130px;text-align:right}}
.pull{font-family:var(--read);font-style:italic;font-size:clamp(1.2rem,2.3vw,1.5rem);line-height:1.45;margin:8px 0 22px;padding-left:20px;border-left:3px solid var(--gold)}

/* mapa */
.mapfig{margin:6px 0 4px;display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:24px;align-items:center}
.maplink{display:block;text-decoration:none;color:inherit;border-radius:18px;background:var(--soft);padding:14px;transition:background .2s}
.maplink:hover{background:var(--blue-soft)}
.maplink svg{width:100%;height:auto;display:block}
.peru{fill:#fff;stroke:#c5cbd4;stroke-width:1.2}
.mine-dot{fill:var(--gold)}
.mine-pulse{fill:none;stroke:var(--gold);stroke-width:2;transform-origin:var(--o);animation:ping 2s ease-out infinite}
@keyframes ping{from{transform:scale(.3);opacity:1}to{transform:scale(2.2);opacity:0}}
.city{fill:var(--muted)}
.maptext{display:grid;gap:10px}
.maptext p{font-family:var(--read);font-size:1.02rem;line-height:1.65;margin:0}
.go{justify-self:start;display:inline-flex;gap:10px;align-items:center;text-decoration:none;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:.95rem}
.go span{transition:transform .2s}.go:hover span{transform:translateX(4px)}
.small{font-size:.8rem;color:var(--muted)}

.next{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:24px;margin-top:20px}
.next a.fw{display:inline-flex;gap:10px;align-items:center;text-decoration:none;color:var(--bg);background:var(--ink);padding:12px 20px;border-radius:999px;font-weight:600}
.next .back{color:var(--muted);text-decoration:none}
.sources{font-size:.78rem;color:var(--muted);display:grid;gap:4px;margin-top:28px;padding-bottom:64px}
.sources a{color:var(--muted)}

/* ---------- resultados ---------- */
.res{display:grid;gap:34px;padding-bottom:70px;animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.res-head{padding-top:44px;display:grid;gap:10px;max-width:760px}
.res-head h1{font-weight:600;font-size:clamp(1.9rem,4.4vw,3rem);line-height:1.08;letter-spacing:-.02em;margin:0}
.block{display:grid;gap:14px}
.block h2{font-weight:600;font-size:clamp(1.2rem,2.2vw,1.55rem);margin:0}
.block .why{font-family:var(--read);font-size:1.04rem;line-height:1.65;color:var(--ink);margin:0;max-width:72ch}
.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:9px 14px;border-radius:9px;cursor:pointer;font-size:.9rem;color:var(--muted);text-align:left;line-height:1.25}
.seg button small{display:block;font-size:.72rem;opacity:.8}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.headline{font-family:var(--read);font-size:clamp(1.15rem,2vw,1.4rem);line-height:1.55;margin:0;max-width:66ch}
.headline b{font-family:var(--display);font-weight:600}
.stats{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{flex:1 1 140px;padding:14px 16px 14px 0;display:grid;gap:2px}
.stat .l{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-weight:600;font-size:clamp(1.15rem,2.2vw,1.5rem);font-variant-numeric:tabular-nums}
.stat .v.neg{color:var(--red)}
.chart{min-width:0;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:520px;height:auto}
.chart text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.how{font-size:.88rem;line-height:1.55;background:var(--soft);border-radius:12px;padding:12px 14px;color:var(--ink);max-width:80ch}
.how b{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-right:8px}
.slider{display:grid;gap:8px;max-width:680px}
.slider input{width:100%;accent-color:var(--gold)}
.slider output{font-weight:600}
.tornado{display:grid;gap:10px;max-width:780px}
.trow{display:grid;grid-template-columns:150px minmax(0,1fr) 80px;gap:12px;align-items:center;font-size:.92rem}
.track{position:relative;height:22px;background:var(--soft);border-radius:6px}
.track .mid{position:absolute;left:50%;top:-4px;bottom:-4px;border-left:1.5px solid #9aa2ae}
.track .bar{position:absolute;top:0;bottom:0;border-radius:6px;transition:width .8s cubic-bezier(.2,.7,.2,1)}
.trow .n{font-family:var(--mono);font-size:.85rem;text-align:right}
.facts{display:grid;gap:0;max-width:760px}
.facts div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.98rem}
.facts div span:last-child{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.facts small{color:var(--muted);font-size:.78rem}
.hyp{display:grid;gap:0;max-width:860px}
.hyp div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.hyp p{margin:0;font-family:var(--read);font-size:1rem;line-height:1.5}
.hyp small{display:block;font-family:var(--display);color:var(--muted);font-size:.8rem;margin-top:3px}
.pill{font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:#e3f3ea;color:var(--green)}.pill.no{background:var(--red-soft);color:var(--red)}

@media (max-width:720px){.mapfig{grid-template-columns:1fr}.maplink{max-width:320px}.trow{grid-template-columns:110px minmax(0,1fr) 64px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- resultados: tablero ---------- */
.db{background:#f4f6f9;min-height:calc(100vh - 80px);padding-bottom:40px}
.db-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;padding:26px 0 18px}
.db-head h1{font-family:var(--serif);font-weight:500;font-size:clamp(1.7rem,3.4vw,2.4rem);line-height:1.1;margin:6px 0 0}
.db-ctl{display:flex;gap:10px;flex-wrap:wrap}.db-ctl .seg{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05)}.db-ctl .seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.kpis{display:grid;grid-template-columns:1.3fr repeat(4,1fr);gap:14px}
.kpi{background:#fff;border-radius:16px;padding:16px 18px;display:grid;gap:4px;box-shadow:0 1px 2px rgba(21,30,50,.05),0 8px 24px -18px rgba(21,30,50,.3);border:1px solid #e9ecf1}
.kpi .kl{font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi .kv{white-space:nowrap;font-size:clamp(1.25rem,2vw,1.65rem);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .kv small{font-size:.55em;font-weight:600;color:var(--muted)}.kpi .kv.neg{color:var(--red)}
.kpi .ks{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi.main{background:var(--gold);border-color:var(--gold)}.kpi.main .kl,.kpi.main .ks,.kpi.main .kv small{color:rgba(255,255,255,.75)}.kpi.main .kv{color:#fff;font-size:clamp(1.6rem,3vw,2.3rem)}
.kpi.risk .ks i{width:9px;height:9px;border-radius:50%;background:currentColor}
.kpi.risk.ok .ks{color:var(--green)}.kpi.risk.mid .ks{color:#b7791f}.kpi.risk.bad .ks{color:var(--red)}.kpi.risk.bad .kv{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;margin-top:14px}
.card{background:#fff;border-radius:18px;padding:18px 20px;border:1px solid #e9ecf1;box-shadow:0 1px 2px rgba(21,30,50,.05),0 10px 30px -22px rgba(21,30,50,.35);display:grid;gap:12px;align-content:start;min-width:0}
.c8{grid-column:span 8}.c4{grid-column:span 4}.c6{grid-column:span 6}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ch h2{font-size:1.05rem;font-weight:600;margin:0}
.ctag{font-size:.74rem;color:var(--muted);background:var(--soft);border-radius:999px;padding:4px 10px;white-space:nowrap}
.ctag.score{background:#e3f3ea;color:var(--green);font-weight:600}
.card .chart svg{min-width:460px}
.card .slider{max-width:none;gap:6px}.card .slider label{font-size:.88rem}.card .slider .big{font-weight:700;color:var(--gold)}
.tip{font-size:.82rem;color:var(--muted);line-height:1.5}.tip summary{cursor:pointer;color:var(--gold);font-weight:600;font-size:.8rem}
.empty-n{font-size:.92rem;color:var(--muted);margin:0}
.tor{display:grid;gap:14px;padding-top:4px}
.tr{display:grid;grid-template-columns:minmax(0,1fr) 58px;grid-template-areas:"n v" "t t";gap:4px 8px;align-items:center}
.tn{grid-area:n;font-size:.88rem}.tv{grid-area:v;font-family:var(--mono);font-size:.84rem;text-align:right;font-weight:600}.tv.neg{color:var(--red)}
.tt{grid-area:t;position:relative;height:16px;background:var(--soft);border-radius:5px}
.tt .mid{position:absolute;left:50%;top:-3px;bottom:-3px;border-left:1.5px solid #9aa2ae}.tt .bar{position:absolute;top:0;bottom:0;border-radius:5px}
.r2{display:grid;grid-template-columns:auto auto 1fr;gap:4px 8px;align-items:baseline;background:var(--soft);border-radius:12px;padding:10px 12px}
.r2 span{font-size:.75rem;font-weight:600;color:var(--muted)}.r2 b{font-size:1.2rem}.r2 small{grid-column:1/-1;font-size:.8rem;color:var(--muted)}
.gauge{padding:8px 0 44px}
.gtrack{position:relative;height:14px;border-radius:999px;background:#e3f3ea}
.gfill{position:absolute;left:0;top:0;bottom:0;border-radius:999px 0 0 999px;background:#f6d6d1}
.gmk{position:absolute;top:-4px;height:22px;border-left:2px solid var(--ink);font-size:.74rem;color:var(--muted);white-space:nowrap;padding:24px 0 0 0}
.gmk b{display:block;font-size:.88rem;color:var(--ink)}.gmk.be{transform:translateX(-1px)}.gmk.be b{color:var(--red)}
.gmk.mk{right:0;border-left:0;border-right:2px solid var(--ink);text-align:right;padding-right:0}.gmk.mk b{color:var(--green)}
.gtext{margin:0;font-size:.95rem}.gtext b{color:var(--green);font-size:1.1rem}
.facts2g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.facts2g div{background:var(--soft);border-radius:10px;padding:9px 11px;display:grid;gap:2px}
.facts2g span{font-size:.74rem;color:var(--muted)}.facts2g b{font-size:.98rem;font-variant-numeric:tabular-nums}
.note2{margin:0;font-size:.78rem;color:var(--muted)}
.hl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hl li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 12px;border-radius:12px;background:var(--soft)}
.hl .hi{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;color:#fff;background:var(--green)}
.hl li.n .hi{background:var(--red)}.hl li.n{background:var(--red-soft)}
.hl p{margin:0;font-size:.9rem;line-height:1.35}.hl small{font-size:.74rem;color:var(--muted)}
.hl .hs{font-size:.74rem;font-weight:600;color:var(--green);white-space:nowrap}.hl li.n .hs{color:var(--red)}
.db-foot{margin-top:16px;display:grid;gap:4px}.db-foot .next{margin-top:0;padding-top:12px}
@media (max-width:980px){.kpis{grid-template-columns:repeat(2,1fr)}.kpi.main{grid-column:1/-1}.c8,.c4,.c6{grid-column:1/-1}}
@media (max-width:520px){.facts2g{grid-template-columns:1fr}.hl li{grid-template-columns:26px minmax(0,1fr)}.hl .hs{grid-column:2}}
/* ---------- repositorio ---------- */
.repo{padding-bottom:64px}
.rhead2{padding:34px 0 18px;display:grid;gap:8px}
.rhead2 h1,.otext h1{font-family:var(--serif);font-weight:500;font-size:clamp(2rem,4.4vw,2.8rem);line-height:1.1;margin:0;color:var(--ink)}
.lead2{font-family:var(--read);font-size:1.05rem;line-height:1.6;margin:0;max-width:62ch;color:var(--ink)}
.note{font-size:.92rem;margin:6px 0;color:var(--gold)}
.tools2{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0 8px}
.tools2 .views{width:min(340px,100%)}
.count{font-family:var(--serif);font-size:1.05rem;color:var(--gold)}
.arts{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.art{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}
.anum{font-family:var(--serif);font-size:1.7rem;color:var(--gold);line-height:1}
.abody{display:grid;gap:8px;min-width:0}
.atop{display:flex;gap:12px;align-items:baseline;justify-content:space-between}
.atop h3,.pcard h3{font-family:var(--serif);font-weight:500;font-size:1.3rem;line-height:1.25;margin:0;color:var(--ink);overflow-wrap:anywhere}
.empty-t{opacity:.45}
.lang{font-size:.72rem;font-weight:600;letter-spacing:.08em;border:1px solid var(--gold);color:var(--gold);border-radius:6px;padding:2px 7px;flex:none}
.ameta{margin:0;font-family:var(--read);font-size:.98rem;color:var(--ink);opacity:.8}
.files{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fgroup{display:inline-flex;align-items:center;gap:4px}
.dl{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:.88rem;color:var(--ink);cursor:pointer}
.dl:hover{border-color:var(--gold);color:var(--gold)}
.dl small{font-size:.76rem;opacity:.65}
.dl .ico{color:var(--gold);font-weight:700}
.dl.off{cursor:default;opacity:.45}.dl.off:hover{border-color:var(--line);color:var(--ink)}
.up{position:relative;font-size:.8rem;font-weight:600;color:var(--gold);background:var(--gold-soft);border-radius:999px;padding:8px 12px;cursor:pointer;overflow:hidden}
.up input{position:absolute;inset:0;opacity:0;cursor:pointer}
.up.busy{opacity:.6}
.rm,.edit{border:0;background:transparent;font:inherit;font-size:.82rem;color:var(--ink);opacity:.55;cursor:pointer;padding:8px}
.rm:hover,.edit:hover{opacity:1;color:var(--gold)}
a.edit{text-decoration:none}
.meta{display:grid;gap:10px;background:var(--soft);border-radius:14px;padding:14px}
.meta label{display:grid;gap:4px;font-size:.8rem;font-weight:600;color:var(--ink)}
.meta input,.meta select,#pwset input,.dlgbox input{font:inherit;font-size:.95rem;font-weight:400;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--ink);min-width:0}
.row3{display:grid;grid-template-columns:90px minmax(0,1fr) 130px;gap:10px}
.mbtns{display:flex;gap:8px;flex-wrap:wrap}
.mbtns .go,#pwset .go,.lockline .go{border:0;cursor:pointer;font:inherit;font-weight:600;font-size:.9rem}
.access{margin:6px 0 10px;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.access summary{cursor:pointer;font-size:.9rem;font-weight:600;color:var(--gold)}
#pwset{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.lockline{margin:6px 0 10px}.okk{font-size:.9rem;font-weight:600;color:var(--gold)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px;margin-top:10px}
.pcard{display:grid;gap:10px;align-content:start}
.pthumb,.othumb{position:relative;aspect-ratio:3/4;background:var(--soft);border-radius:12px;overflow:hidden;display:grid;place-items:center;border:1px solid var(--line)}
.pthumb canvas,.othumb canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .4s}
.pthumb canvas.ready,.othumb canvas.ready{opacity:1;background:#fff}
.pph{font-family:var(--serif);font-size:1.1rem;color:var(--gold);opacity:.7}
.emptybox{font-family:var(--read);font-size:1.02rem;border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center}
.own{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:40px;align-items:center;padding:40px 0}
.otext{display:grid;gap:12px;align-content:center}
.otitle{font-family:var(--serif);font-size:1.35rem;margin:0;color:var(--ink)}
.dlg{position:fixed;inset:0;background:rgba(21,24,30,.35);display:grid;place-items:center;z-index:50;padding:16px}
.dlg[hidden]{display:none}
.dlgbox{background:#fff;border-radius:18px;padding:24px;width:min(380px,100%);display:grid;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.dlgbox h3{font-family:var(--serif);font-weight:500;font-size:1.6rem;margin:0}
.dlgbox p{margin:0;font-family:var(--read)}
.err{font-size:.85rem;color:#a33;min-height:1em}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:.9rem;z-index:60;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
@media (max-width:720px){.own{grid-template-columns:1fr;gap:22px;padding:24px 0}.othumb{max-width:280px}.row3{grid-template-columns:1fr 1fr}.art{grid-template-columns:40px minmax(0,1fr)}}
/* ---------- catálogo bilingüe ---------- */
.cat{margin-top:48px;display:grid;gap:6px}
.cat h2{font-family:var(--serif);font-weight:500;font-size:clamp(1.6rem,3.4vw,2.2rem);margin:0}
.cat .lead2{font-size:.98rem;color:var(--muted)}
.crows{list-style:none;margin:12px 0 0;padding:0;border-top:1px solid var(--line)}
.crow{display:grid;grid-template-columns:52px minmax(0,1fr) minmax(250px,auto);gap:18px;align-items:start;padding:18px 0;border-bottom:1px solid var(--line)}
.crow .anum{font-size:1.5rem;padding-top:2px}
.ct-es{font-family:var(--serif);font-weight:500;font-size:1.18rem;line-height:1.3;margin:0;color:var(--ink);overflow-wrap:anywhere}
.ct-en{font-family:var(--serif);font-style:italic;font-size:1.02rem;line-height:1.35;margin:4px 0 0;color:var(--muted);overflow-wrap:anywhere}
.ct-meta{margin:6px 0 0;font-family:var(--read);font-size:.86rem;color:var(--muted)}
.cacts{display:grid;gap:8px;justify-items:end}
.cgrp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cgrp .tag{font-size:.68rem;font-weight:700;letter-spacing:.1em;width:28px;text-align:center;border-radius:6px;padding:3px 0}
.cgrp .tag.es{background:var(--gold);color:#fff}.cgrp .tag.en{border:1px solid var(--gold);color:var(--gold)}
.cgrp .dl{padding:6px 12px;font-size:.84rem}
.cpost{font-size:.82rem;color:var(--gold);text-decoration:none;padding:4px 2px}.cpost:hover{text-decoration:underline}
@media (max-width:760px){.crow{grid-template-columns:38px minmax(0,1fr);gap:12px}.cacts{grid-column:2;justify-items:start}.cgrp{justify-content:flex-start}}
/* ---------- originales en inglés ---------- */
.bk-en{margin:-6px 0 0;font-family:var(--serif);font-style:italic;font-size:1.08rem;line-height:1.35;color:var(--muted)}
.enlist{margin-top:46px;display:grid;gap:6px}
.enlist h2{font-family:var(--serif);font-weight:500;font-size:clamp(1.6rem,3.4vw,2.2rem);margin:0}
.enrows{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
.enrow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.enrow .anum{font-size:1.4rem}
.enrow h3{font-family:var(--serif);font-weight:500;font-size:1.15rem;line-height:1.3;margin:0;color:var(--ink);overflow-wrap:anywhere}
.enrow p{margin:2px 0 0;font-family:var(--read);font-size:.9rem;color:var(--muted)}
.enrow .files{justify-content:flex-end}
.rd{position:fixed;inset:0;z-index:72;background:#eef1f6;display:grid;grid-template-rows:auto minmax(0,1fr)}
.rd[hidden]{display:none}
.rdbar{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-left,0px));background:#fff;border-bottom:1px solid var(--line)}
.rdbar h3{flex:1;min-width:0;margin:0;font-family:var(--serif);font-weight:500;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rdbar small{font-size:.8rem;color:var(--muted);white-space:nowrap}
.rdpages{overflow:auto;padding:18px 16px 40px;display:grid;justify-items:center;gap:16px;align-content:start}
.rdpages img{width:min(900px,100%);height:auto;background:#fff;box-shadow:0 14px 30px -18px rgba(21,30,50,.45)}
@media (max-width:640px){.enrow{grid-template-columns:36px minmax(0,1fr)}.enrow .files{grid-column:2;justify-content:flex-start}}
/* ---------- sala de pósters ---------- */
.phead{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;padding-bottom:10px}
.phead>div:first-child{display:grid;gap:6px}.pmode{width:200px}
.expo{--cw:clamp(170px,min(56vw,calc((100dvh - 430px)/1.414)),310px);position:relative;height:calc(var(--cw)*1.414 + 96px);perspective:1500px;overflow:hidden;border-radius:26px;outline:none;
  background:linear-gradient(#fff 0%,#f7f8fb 72%,#eef1f6 100%);touch-action:pan-y;user-select:none;margin-top:6px}
.expo:focus-visible{box-shadow:0 0 0 2px var(--gold)}
.spot{position:absolute;left:50%;top:-30%;width:min(720px,90%);height:150%;transform:translateX(-50%);background:radial-gradient(ellipse 50% 60% at 50% 30%,rgba(36,64,107,.13),rgba(36,64,107,0) 70%);pointer-events:none}
.floor{position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(rgba(36,64,107,0),rgba(36,64,107,.05));border-top:1px solid rgba(36,64,107,.08)}
.rail{position:absolute;inset:0;transform-style:preserve-3d}
.pf{position:absolute;left:50%;top:26px;width:var(--cw);aspect-ratio:1/1.414;margin:0 0 0 calc(var(--cw) / -2);padding:9px;background:#fff;border:4px solid #1b2130;box-sizing:border-box;cursor:pointer;
  transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .6s,filter .6s,box-shadow .6s;filter:saturate(.75) brightness(.97);
  box-shadow:0 26px 50px -22px rgba(21,30,50,.45);-webkit-box-reflect:below 6px linear-gradient(rgba(0,0,0,.16),rgba(0,0,0,0) 24%)}
.pf.cur{filter:none;box-shadow:0 40px 70px -24px rgba(21,30,50,.55),0 0 0 1px rgba(36,64,107,.15)}
.rail.intro .pf{transform:translateY(80px) scale(.7)!important;opacity:0!important;transition:none}
.pin{position:relative;display:block;width:100%;height:100%;overflow:hidden;background:#fff}
.pin img,.pin canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.pin canvas{opacity:0;transition:opacity .5s}.pin canvas.ready{opacity:1}
.ph{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr auto;padding:12% 10%;text-align:left;border:1px solid var(--gold-soft);
  background:linear-gradient(160deg,#fff 0%,#fff 55%,var(--gold-soft) 100%)}
.phn{font-family:var(--serif);font-size:calc(var(--cw,240px)*.32);line-height:.9;color:var(--gold);letter-spacing:-.02em}
.mosaic .phn{font-size:3.2rem}
.pht{align-self:center;font-family:var(--serif);font-size:1.05rem;line-height:1.25;color:var(--ink);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.phl{font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);border-top:1px solid var(--gold-soft);padding-top:8px}
.pnav{position:absolute;top:calc(50% - 30px);width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.92);color:var(--ink);font-size:1.1rem;cursor:pointer;z-index:80;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.pnav:hover{border-color:var(--gold);color:var(--gold)}.pnav.pl{left:14px}.pnav.pr{right:14px}
.pcap{display:grid;justify-items:center;gap:6px;text-align:center;padding:18px 0 6px}
.pcap.swap{animation:capin .55s cubic-bezier(.2,.8,.2,1)}
@keyframes capin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pnum{font-family:var(--serif);font-size:2.2rem;line-height:1;color:var(--gold)}.pnum span{font-size:1rem;margin-left:6px;opacity:.6}
.ptitle{font-family:var(--serif);font-weight:500;font-size:clamp(1.25rem,2.6vw,1.6rem);line-height:1.2;margin:0;max-width:40ch;color:var(--ink);text-wrap:balance}
.pmeta{margin:0;font-family:var(--read);font-size:.98rem;opacity:.8}
.pfiles{justify-content:center;margin-top:6px}
.ticks{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin:14px auto 0;max-width:720px}
.ticks button{position:relative;border:0;background:transparent;font:inherit;font-size:.78rem;color:var(--ink);opacity:.45;padding:7px 6px;border-radius:8px;cursor:pointer;min-width:34px}
.ticks button.has{opacity:.85}.ticks button.has::after{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--gold)}
.ticks button.on{background:var(--ink);color:#fff;opacity:1}.ticks button.on::after{background:#fff}
.pcount{text-align:center;font-family:var(--serif);font-size:1.05rem;color:var(--gold);margin:10px 0 0}
.mosaic{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px;margin-top:10px}
.mo{display:block;aspect-ratio:1/1.414;padding:7px;border:3px solid #1b2130;background:#fff;cursor:pointer;transition:transform .3s,box-shadow .3s;box-shadow:0 14px 30px -18px rgba(21,30,50,.45)}
.mo:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:0 24px 40px -20px rgba(21,30,50,.55)}
.lb{position:fixed;inset:0;z-index:70;background:rgba(250,251,253,.97);display:grid;place-items:center;padding:56px 16px 16px;overflow:auto}
.lb[hidden]{display:none}
.lbin{display:grid;place-items:center;max-width:100%}
.lbin canvas,.lbin img{max-height:calc(100dvh - 80px);max-width:100%;width:auto;height:auto;box-shadow:0 30px 80px -30px rgba(21,30,50,.5);cursor:zoom-in;background:#fff}
.lb.zoom{place-items:start center}.lb.zoom .lbin canvas,.lb.zoom .lbin img{max-height:none;width:min(1600px,100%);cursor:zoom-out}
.lbin .natpdf{width:min(1000px,92vw)}
.lbx{position:fixed;top:14px;right:16px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:1rem;cursor:pointer;z-index:2}
@media (prefers-reduced-motion:reduce){.pf{transition:opacity .2s}.pcap.swap{animation:none}}
@media (max-width:640px){.pnav{display:none}.expo{border-radius:18px}.pht{font-size:.9rem}}

/* ---------- datos y código ---------- */

.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}

.dc-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}

@media (max-width:760px){.dc-kpis{grid-template-columns:1fr 1fr}.pipe li{grid-template-columns:36px minmax(0,1fr)}.pipe a{grid-column:2}.dc-tab{font-size:.84rem}}

.rctl{justify-content:flex-start}

.exres{display:grid;gap:2px;background:var(--soft);border-radius:12px;padding:12px 14px}.exres span{font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.exres b{font-size:1.7rem;font-variant-numeric:tabular-nums}.exres small{font-size:.82rem;color:var(--muted)}
.mbtns .ghost{font:inherit;font-size:.86rem;cursor:pointer;text-decoration:none;color:var(--ink)}

.glist button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.gimg{display:block;background:#fff;border-radius:12px;border:1px solid var(--line);cursor:zoom-in}.gimg img{width:100%;max-height:560px;object-fit:contain;display:block}
.gmain .why{font-family:var(--read);font-size:1.02rem;line-height:1.6;margin:0}
.eq{font-family:var(--serif);font-size:1.25rem;text-align:center;margin:4px 0 8px;color:var(--ink)}

.quick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:6px 0 20px}
.qk{display:grid;gap:4px;align-content:start;text-align:left;border:1px solid #e3e7ee;background:#fff;border-radius:16px;padding:14px;cursor:pointer;font:inherit;color:var(--ink);text-decoration:none;transition:transform .2s,border-color .2s,box-shadow .2s}
.qk:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 14px 28px -20px rgba(36,64,107,.7)}

.ftabs button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff}.ftabs button[aria-pressed="true"] small{color:rgba(255,255,255,.8)}.ftabs button[aria-pressed="true"] em{background:rgba(255,255,255,.2)}

.fext.py{background:#e8f0fb;color:#2463b8}.fext.csv{background:#e3f3ea;color:#23825a}.fext.pdf{background:var(--red-soft);color:var(--red)}.fext.png{background:#fdf1dc;color:#9a6a0c}.fext.json{background:#efe9fb;color:#5b3fa8}

function vanJS(p,k){let s=-MC.i0;for(let t=1;t<=MC.n;t++){const m=MC.q*(p-MC.c),f=m-MC.tau*Math.max(m,0);s+=f/Math.pow(1+k,t)}return (s-MC.cierre/Math.pow(1+k,MC.n+1))/1e6}
function peqJS(k){const a=MC.c+100,b=MC.c+1000,va=vanJS(a,k),vb=vanJS(b,k);return a-va*(b-a)/(vb-va)}
let exP=4437,exK=8.26;

function bindExplora(){const cv=document.getElementById('ex3d');if(!cv)return;let yaw=.5,pitch=.42,drag=null,raf=0;
const NP=34,NK=24,Pm=1200,PM=5600,Km=4,KM=14,G=[];let vmin=1e9,vmax=-1e9;
for(let i=0;i<NP;i++){G[i]=[];for(let j=0;j<NK;j++){const v=vanJS(Pm+(PM-Pm)*i/(NP-1),(Km+(KM-Km)*j/(NK-1))/100);G[i][j]=v;vmin=Math.min(vmin,v);vmax=Math.max(vmax,v)}}
const col=v=>{if(v<0){const t=Math.min(1,-v/(-vmin));return `rgb(${Math.round(246-(246-180)*t)},${Math.round(198-(198-47)*t)},${Math.round(197-(197-46)*t)})`}const t=Math.min(1,v/vmax);return `rgb(${Math.round(232-(232-22)*t)},${Math.round(238-(238-74)*t)},${Math.round(246-(246-138)*t)})`};
const nx=p=>(p-Pm)/(PM-Pm)*2-1,nz=k=>1-(k-Km)/(KM-Km)*2,ny=v=>(v-vmin)/(vmax-vmin)*.95-.48;
function pr(W,H,x,y,z){const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);let X=x*cy-z*sy,Z=x*sy+z*cy;let Yy=y*cp-Z*sp;Z=y*sp+Z*cp;const f=5/(5-Z);return [W/2+X*f*W*.27,H*.45-Yy*f*H*.44,Z]}
function draw(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1,W=r.width,H=Math.min(500,Math.max(340,W*.7));cv.width=W*d;cv.height=H*d;cv.style.height=H+'px';const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,W,H);
  const floor=-.58,quads=[];
  for(let i=0;i<NP-1;i++)for(let j=0;j<NK-1;j++){const c=[[i,j],[i+1,j],[i+1,j+1],[i,j+1]].map(([a,b])=>pr(W,H,nx(Pm+(PM-Pm)*a/(NP-1)),ny(G[a][b]),nz(Km+(KM-Km)*b/(NK-1))));quads.push([c,(c[0][2]+c[2][2])/2,(G[i][j]+G[i+1][j+1])/2])}
  // piso con la frontera VAN = 0
  x.strokeStyle='#e3e7ee';x.lineWidth=1;for(let t=0;t<=4;t++){const a=pr(W,H,-1+t/2,floor,-1),b=pr(W,H,-1+t/2,floor,1),c=pr(W,H,-1,floor,-1+t/2),e=pr(W,H,1,floor,-1+t/2);x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.moveTo(c[0],c[1]);x.lineTo(e[0],e[1]);x.stroke()}
  x.strokeStyle='#15181e';x.lineWidth=2;x.beginPath();for(let j=0;j<NK;j++){const k=Km+(KM-Km)*j/(NK-1),a=pr(W,H,nx(peqJS(k/100)),floor,nz(k));j?x.lineTo(a[0],a[1]):x.moveTo(a[0],a[1])}x.stroke();
  quads.sort((a,b)=>a[1]-b[1]).forEach(([c,_,v])=>{x.fillStyle=col(v);x.strokeStyle='rgba(255,255,255,.55)';x.lineWidth=.5;x.beginPath();c.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.fill();x.stroke()});
  // ejes
  x.fillStyle='#6c7380';x.font='11px JetBrains Mono,monospace';x.textAlign='center';
  [1500,2500,3500,4500,5500].forEach(p=>{const a=pr(W,H,nx(p),floor,1.12);x.fillText('US$ '+f0(p),a[0],a[1]+4)});
  [4,6,8,10,12,14].forEach(k=>{const a=pr(W,H,1.14,floor,nz(k));x.fillText(k+' %',a[0],a[1]+4)});
  // punto elegido
  const v=vanJS(exP,exK/100),a=pr(W,H,nx(exP),ny(v),nz(exK)),b=pr(W,H,nx(exP),floor,nz(exK));
  x.strokeStyle='#15181e';x.setLineDash([3,3]);x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke();x.setLineDash([]);
  x.fillStyle=v<0?'#c0392b':'#24406b';x.strokeStyle='#fff';x.lineWidth=2.5;x.beginPath();x.arc(a[0],a[1],7,0,7);x.fill();x.stroke();
  x.fillStyle='#15181e';x.font='600 12px Outfit,sans-serif';x.textAlign='left';x.fillText(`VAN US$ ${f0(v)} M`,a[0]+11,a[1]-9)}
function upd(){const v=vanJS(exP,exK/100),pe=peqJS(exK/100);document.getElementById('exPo').textContent='US$ '+f0(exP);document.getElementById('exKo').textContent=fxs(exK,2)+' %';
  const o=document.getElementById('exV');o.textContent=`US$ ${f0(v)} M`;o.style.color=v<0?'var(--red)':'var(--gold)';
  document.getElementById('exE').textContent=`Precio de equilibrio a esta tasa: US$ ${f0(pe)} · ${exP>pe?'el precio supera al equilibrio en '+fxs((1-pe/exP)*100)+' %':'el precio está por debajo del equilibrio'}`}
const ip=document.getElementById('exP'),ik=document.getElementById('exK');ip.oninput=()=>{exP=+ip.value;upd()};ik.oninput=()=>{exK=+ik.value;upd()};
document.querySelectorAll('[data-pre]').forEach(b=>b.onclick=()=>{const [p,k]=b.dataset.pre.split('|').map(Number);exP=p;exK=k;ip.value=p;ik.value=k;upd()});
cv.onpointerdown=e=>{drag=[e.clientX,e.clientY,yaw,pitch];cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(!drag)return;yaw=drag[2]+(e.clientX-drag[0])*.008;pitch=Math.max(.05,Math.min(1.2,drag[3]+(e.clientY-drag[1])*.006))};cv.onpointerup=cv.onpointercancel=()=>{drag=null};
const loop=()=>{raf=requestAnimationFrame(loop);if(!document.body.contains(cv)){cancelAnimationFrame(raf);return}draw()};window.__mcStop=()=>cancelAnimationFrame(raf);upd();loop()}

const R={db:null,assets:null,downloads:null,user:null,canEdit:false,docs:{},cfg:null,loaded:false,slow:false,unlocked:false,editing:null,lang:'all',busy:{},msg:''};

async function repoInit(){
  const [db,assets,downloads,user]=window.claude?.use?await Promise.all(['db','assets','downloads','user'].map(n=>window.claude.use(n).catch(()=>null))):[null,null,null,null];
  Object.assign(R,{db,assets,downloads,user});
  R.canEdit=!!assets||((await user?.canEdit?.().catch(()=>false))??false);
  if(!db){R.docs=STATIC_DOCS;R.loaded=true;repaint();return}
  const t=setTimeout(()=>{R.slow=true;repaint()},10000);
  db.collection('docs').onSnapshot(s=>{if(!s.metadata?.fromCache){clearTimeout(t);R.slow=false}R.docs={};s.docs.forEach(d=>R.docs[d.id]=d.data()||{});R.loaded=true;repaint()},()=>{clearTimeout(t);if(!Object.keys(R.docs).length)R.docs=STATIC_DOCS;R.loaded=true;repaint()});
  db.doc('config/access').onSnapshot(s=>{R.cfg=s.exists?s.data():null;repaint()},()=>{});
}
function repaint(){const ae=document.activeElement;const lbx=document.getElementById('lb');if(lbx&&!lbx.hidden)return;const rdx=document.getElementById('rd');if(rdx&&!rdx.hidden)return;if(ae&&ae.closest&&ae.closest('form.meta,#pwset,#lockform'))return;const dl=document.getElementById('lockdlg');if(dl&&!dl.hidden)return;const h=location.hash.slice(1);if(['articulos','posters','journal','beamer','miposter'].includes(h))paint(true)}
const locked=()=>!!(R.cfg&&R.cfg.hash)&&!R.unlocked&&!R.canEdit;
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const fmtSize=n=>n>1048576?(n/1048576).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(n/1024))+' KB';

/* ---------- descarga ---------- */
async function getFile(f,ext){
  if(locked()){openLock();return}
  if(f.href){const a=document.createElement('a');a.href=f.href;a.download=f.name||('archivo.'+ext);document.body.appendChild(a);a.click();a.remove();return}
  if(!R.downloads||f.remote){if(f.id&&!f.enc&&!f.remote){const a=document.createElement('a');a.href='/_blob/'+f.id;a.download=f.name||('archivo.'+ext);a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();return}if(f.remote){toast('El LaTeX .zip se descarga ingresando con una cuenta de Claude.');return}toast('Las descargas no están disponibles en esta vista.');return}
  try{let data;if(f.b64){data=new Blob([f.b64],{type:'text/plain'})}else{const r=await fetch(blobURL(f.id));if(!r.ok)throw 0;data=await r.blob()}
    if(f.enc==='b64'){const txt=await data.text();const bin=atob(txt.trim());const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);data=new Blob([u],{type:'application/zip'})}
    await R.downloads.save({filename:f.name||('archivo.'+ext),data});
  }catch(e){if(e&&e.code==='declined')return;toast(e&&e.code==='rejected_extension'?'Ese tipo de archivo no se puede descargar aquí.':'No se pudo descargar el archivo. Inténtalo de nuevo.')}}
/* ---------- subida ---------- */
async function putFile(docId,field,file){
  if(!R.assets||!R.db)return;const isZip=/\.zip$/i.test(file.name);const isPdf=/\.pdf$/i.test(file.name)||file.type==='application/pdf';
  if(field==='posterZip'&&!isZip){toast('Elige un archivo .zip exportado de Overleaf.');return}
  if(field!=='posterZip'&&!isPdf){toast('Elige un archivo PDF.');return}
  R.busy[docId+field]=true;repaint();
  try{let blob=file,opts={type:'application/pdf'},enc=null;
    if(isZip){const buf=new Uint8Array(await file.arrayBuffer());let s='';for(let i=0;i<buf.length;i+=0x8000)s+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));blob=new Blob([btoa(s)],{type:'text/plain'});opts={type:'text/plain'};enc='b64'}
    const res=await R.assets.upload(blob,opts);
    const prev=R.docs[docId]?.[field];
    const rec={id:res.id,name:file.name,size:file.size,at:new Date().toISOString()};if(enc)rec.enc=enc;
    await R.db.doc('docs/'+docId).set({...(R.docs[docId]||{}),[field]:rec});
    if(prev?.id)R.assets.delete(prev.id).catch(()=>{});
    toast('Archivo subido.');
  }catch(e){toast(e&&e.code==='too_large'?'El archivo supera los 20 MB permitidos.':e&&e.code==='quota_or_state'?'Se llenó el espacio de almacenamiento.':'No se pudo subir el archivo.')}
  R.busy[docId+field]=false;repaint()}
async function dropFile(docId,field){const f=R.docs[docId]?.[field];if(!f)return;const d={...R.docs[docId]};delete d[field];
  try{await R.db.doc('docs/'+docId).set(d);await R.assets.delete(f.id).catch(()=>{});toast('Archivo quitado.')}catch(_){toast('No se pudo quitar el archivo.')}}
async function saveMeta(docId,form){const fd=new FormData(form);const d={...(R.docs[docId]||{})};['title','authors','year','venue','lang'].forEach(k=>{const v=(fd.get(k)||'').toString().trim().slice(0,300);if(v)d[k]=v;else delete d[k]});
  try{await R.db.doc('docs/'+docId).set(d);R.editing=null;toast('Datos guardados.')}catch(_){toast('No se pudieron guardar los datos.')}repaint()}

function openLock(){const m=document.getElementById('lockdlg');if(m){m.hidden=false;setTimeout(()=>document.getElementById('pw')?.focus(),50)}}
async function tryUnlock(pw){if(!R.cfg)return;const h=await sha(R.cfg.salt+pw);if(h===R.cfg.hash){R.unlocked=true;try{sessionStorage.setItem('sg_unlock','1')}catch(_){}document.getElementById('lockdlg').hidden=true;repaint();toast('Descargas desbloqueadas.')}else{const e=document.getElementById('pwerr');if(e)e.textContent='Contraseña incorrecta.'}}
async function setPassword(pw){const salt=[...crypto.getRandomValues(new Uint8Array(12))].map(x=>x.toString(16).padStart(2,'0')).join('');
  try{await R.db.doc('config/access').set({salt,hash:await sha(salt+pw)});toast('Contraseña guardada.')}catch(_){toast('No se pudo guardar la contraseña.')}}
async function clearPassword(){try{await R.db.doc('config/access').delete();toast('Contraseña quitada: las descargas quedan libres.')}catch(_){toast('No se pudo quitar la contraseña.')}}
let toastT;function toast(t){const el=document.getElementById('toast');if(!el)return;el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3200)}

let pdfjsP=null,useCDN=false;
function loadPdfjs(){if(pdfjsP)return pdfjsP;if(useCDN)return loadPdfjsCDN();
  /* pdf.js 6 necesita un navegador reciente (Promise.try y Promise.withResolvers); si no los tiene, se usa la versión 3.11, compatible con navegadores antiguos */
  if(typeof Promise.try!=='function'||typeof Promise.withResolvers!=='function')return loadPdfjsCDN();
  pdfjsP=import('./lib/pdf.min.mjs').then(m=>{m.GlobalWorkerOptions.workerSrc=new URL('lib/pdf.worker.min.mjs',location.href).href;return m}).catch(()=>loadPdfjsCDN());return pdfjsP}
function loadPdfjsCDN(){const add=src=>new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)});
  pdfjsP=add('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js').then(()=>add('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js')).then(()=>{const l=window.pdfjsLib;if(l&&l.GlobalWorkerOptions)l.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';return l}).catch(()=>null);return pdfjsP}

async function drawThumbs(){const cs=[...document.querySelectorAll('canvas[data-pdf]:not(.ready)')];if(!cs.length||locked())return;

const pdfDocs={},pageImg={};
function pdfDoc(id){if(!pdfDocs[id]){pdfDocs[id]=loadPdfjs().then(lib=>{if(!lib)throw 0;if(!thumbCache[id])thumbCache[id]=fetch(blobURL(id)).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()});return thumbCache[id].then(buf=>lib.getDocument({data:buf.slice(0),isEvalSupported:false}).promise)});pdfDocs[id].catch(()=>{delete pdfDocs[id];delete thumbCache[id]})}return pdfDocs[id]}
async function pdfPage(id,n=1){return (await pdfDoc(id)).getPage(n)}
async function pageCount(id){return safePdf(async()=>(await pdfDoc(id)).numPages)}
async function pageRatio(id,n=1){return safePdf(async()=>{const v=(await pdfPage(id,n)).getViewport({scale:1});return v.width/v.height})}
async function pageURL(id,n,w){const k=id+'|'+n+'|'+w;if(pageImg[k])return pageImg[k];return safePdf(()=>pageURLraw(id,n,w,k))}
async function pageURLraw(id,n,w,k){const pg=await pdfPage(id,n);const v=pg.getViewport({scale:1});const vp=pg.getViewport({scale:w/v.width});const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;return pageImg[k]=c.toDataURL('image/jpeg',.9)}
/* si el visor moderno falla al abrir o dibujar un PDF, se reintenta una vez con pdf.js 3.11 */
async function safePdf(fn){try{return await fn()}catch(e){if(useCDN||e===0)throw e;console.warn('El visor moderno falló en este navegador; se usa pdf.js 3.11',e);useCDN=true;pdfjsP=null;Object.keys(pdfDocs).forEach(k=>delete pdfDocs[k]);Object.keys(thumbCache).forEach(k=>delete thumbCache[k]);return await fn()}}

  try{bN=await pageCount(p.id);n=Math.max(1,Math.min(bN,n));const sc=document.getElementById('screen');const w=Math.min(2000,Math.round((sc.clientWidth||800)*2));

    const img=new Image();img.src=url;img.alt='Diapositiva '+n;if(!RM())img.className='in';const olds=[...u.children];u.appendChild(img);setTimeout(()=>olds.forEach(o=>o.remove()),650);
    bPg=n;const c=document.getElementById('bCount');if(c)c.textContent=`${n} / ${bN}`;
    const f=document.getElementById('film');if(f){if(!f.children.length)buildFilm(p.id);f.querySelectorAll('.fr').forEach((b,k)=>b.classList.toggle('on',k===n-1));const on=f.children[n-1];if(on)f.scrollTo({left:on.offsetLeft-f.clientWidth/2+on.clientWidth/2,behavior:RM()?'auto':'smooth'})}
    if(n<bN)pageURL(p.id,n+1,w).catch(()=>{})

async function buildFilm(fid){const f=document.getElementById('film');if(!f)return;const N=Math.min(bN,120);
  f.innerHTML=Array.from({length:N},(_,i)=>`<button class="fr${i===bPg-1?' on':''}" data-fr="${i+1}" aria-label="Diapositiva ${i+1}"><span>${i+1}</span></button>`).join('');
  f.querySelectorAll('.fr').forEach(b=>b.onclick=()=>bShow(+b.dataset.fr));
  for(let i=1;i<=N;i++){if(!document.body.contains(f))return;try{const u=await pageURL(fid,i,300);const b=f.children[i-1];if(b&&!b.querySelector('img')){const im=new Image();im.src=u;im.alt='';b.prepend(im)}}catch(_){return}}}
function bindBeamer(){const sc=document.getElementById('screen');if(!sc||sc.classList.contains('off'))return;const cine=document.getElementById('cine');

  bShow(bPg);document.getElementById('bPrev').onclick=()=>bShow(bPg-1);document.getElementById('bNext').onclick=()=>bShow(bPg+1);
  sc.onclick=e=>{const r=sc.getBoundingClientRect();bShow(bPg+(e.clientX-r.left<r.width/3?-1:1))};
  const fb=document.getElementById('bFull');fb.onclick=async()=>{if(document.fullscreenElement){document.exitFullscreen?.();return}if(cine.classList.contains('theater')){theater(false);return}
    try{await cine.requestFullscreen();}catch(_){theater(true)}};
  let x0=null;cine.onpointerdown=e=>{x0=e.clientX};cine.onpointerup=e=>{if(x0===null)return;const dx=e.clientX-x0;x0=null;if(Math.abs(dx)>50)bShow(bPg+(dx<0?1:-1))}}
function theater(on){const c=document.getElementById('cine');if(!c)return;c.classList.toggle('theater',on);const b=document.getElementById('bFull');if(b){b.textContent=on?'Salir':'Pantalla completa';b.setAttribute('aria-pressed',on)}setTimeout(()=>bShow(bPg),50)}

function csvRows(t,n){const out=[];let row=[],cur='',q=false;for(let i=0;i<t.length&&out.length<n;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else if(c==='"')q=true;else if(c===','){row.push(cur);cur=''}else if(c==='\n'){row.push(cur.replace(/\r$/,''));out.push(row);row=[];cur=''}else cur+=c}if(cur||row.length)out.push([...row,cur]);return out}
async function openFile(p){const f=C3FILES.find(x=>x.p===p)||{p,d:p,s:0},fv=document.getElementById('fv'),B=document.getElementById('fvB'),u=C3URL+encodeURI(p);
 document.getElementById('fvT').textContent=f.d;document.getElementById('fvI').textContent=p;const dl=document.getElementById('fvD');dl.href=u;dl.setAttribute('download',p.split('/').pop());
 fv.hidden=false;document.body.style.overflow='hidden';B.innerHTML='<p class="pph">Abriendo…</p>';document.getElementById('fvX').focus();const e=extOf(p);
 try{if(e==='png'){B.innerHTML=`<img src="${u}" alt="${esc(f.d)}">`;return}
  const r=await fetch(u);if(!r.ok)throw 0;let t=await r.text();
  if(e==='csv'){const rows=csvRows(t,61),tot=t.split('\n').filter(Boolean).length-1;B.innerHTML=`<p class="note2">Se muestran las primeras ${Math.min(60,tot)} filas de ${f0(tot)}. Descarga el archivo para verlo completo.</p><div class="chart"><table class="dc-tab csvt"><thead><tr>${rows[0].map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;return}
  if(e==='ipynb'){try{const nbk=JSON.parse(t);t=nbk.cells.map((c,i)=>`# ── Celda ${i+1} (${c.cell_type==='code'?'código':'texto'}) ──\n`+[].concat(c.source).join('')).join('\n\n')}catch(_){}}
  const lim=e==='json'?20000:200000,cut=t.length>lim;if(cut)t=t.slice(0,lim);
  const lines=t.split('\n');B.innerHTML=`${cut?`<p class="note2">Archivo grande: se muestra el comienzo. Descárgalo para verlo completo.</p>`:''}<pre class="code"><ol>${lines.map(l=>`<li>${esc(l)||' '}</li>`).join('')}</ol></pre>`}
 catch(_){B.innerHTML=`<p class="pph">No se pudo abrir aquí. Usa «Descargar» o <a href="${C3BLOB}${encodeURI(p)}" target="_blank" rel="noopener">ábrelo en GitHub ↗</a>.</p>`}}
function closeFile(){const fv=document.getElementById('fv');if(fv&&!fv.hidden){fv.hidden=true;document.body.style.overflow=''}}
function bindDatos(){
 document.querySelectorAll('[data-fg]').forEach(b=>b.onclick=()=>{fGroup=b.dataset.fg;paint(true)});
 document.querySelectorAll('[data-fv]').forEach(b=>b.onclick=()=>openFile(b.dataset.fv));
 document.querySelectorAll('[data-qk]').forEach(b=>b.onclick=()=>{const k=b.dataset.qk;if(k==='hash'){document.getElementById('verifica').scrollIntoView({behavior:RM()?'auto':'smooth'});return}fGroup=k;paint(true);document.getElementById('explorador').scrollIntoView({behavior:RM()?'auto':'smooth'})});
 const fv=document.getElementById('fv');document.getElementById('fvX').onclick=closeFile;fv.onclick=e=>{if(e.target===fv)closeFile()};
 document.getElementById('hashBtn').onclick=async()=>{const o=document.getElementById('hashRes');o.className='vres';o.textContent='Calculando…';
  try{if(!crypto.subtle)throw 1;const r=await fetch(C3URL+'datos_procesados/datos_procesados_2024200531K.csv',{cache:'no-store'});if(!r.ok)throw 0;const h=[...new Uint8Array(await crypto.subtle.digest('SHA-256',await r.arrayBuffer()))].map(x=>x.toString(16).padStart(2,'0')).join('');
   const ok=h===HASH;o.className='vres '+(ok?'ok':'bad');o.innerHTML=ok?`✓ Coincide. El archivo publicado es exactamente la base usada en el artículo.<br><small>${h}</small>`:`✕ No coincide.<br><small>${h}</small>`}
  catch(e){o.className='vres bad';o.textContent=e===1?'Este navegador no permite calcular el hash en una página sin https. Usa el método de la computadora.':'No se pudo leer el archivo publicado.'}};
 if(!window.__fvk){window.__fvk=1;addEventListener('keydown',e=>{if(e.key==='Escape')closeFile()})}}

  return shell('miposter',`<div class="scene-head"><span class="mc-kick">Mi trabajo · Póster</span><h1>Pieza principal</h1></div>
${status()}${lockBar()}
<section class="museo" id="museo"><div class="mspot" aria-hidden="true"></div><div class="mfloor" aria-hidden="true"></div>
<div class="mwrap"><figure class="mframe${ok?'':' empty'}" id="mframe"${ok?' tabindex="0" role="button" aria-label="Ampliar el póster"':''}><div class="pin" id="mpin">${ok?'<span class="pph">Colgando el póster…</span>':`<div class="ph"><span class="phn">SG</span><span class="pht">${lk?'Protegido con contraseña':'Aún no se ha subido el póster'}</span><span class="phl">Póster</span></div>`}</div><div class="sheen" aria-hidden="true"></div><div class="lens" id="lens" hidden></div></figure>
<aside class="plaque"><span class="pq-k">Póster académico</span><h2>${esc(d.title||'Riesgo del proyecto aurífero San Gabriel')}</h2><p class="pq-a">${esc(d.authors||'Alejandro Soto Antezana')}</p>${d.venue||d.year?`<p class="pq-m">${[d.venue,d.year].filter(Boolean).map(esc).join(' · ')}</p>`:''}<p class="pq-d">Simulación de Monte Carlo sobre el precio del oro, la demanda de inversión y el tipo de cambio.</p>${ok?'<button class="dl" id="mZoom"><span class="ico">⤢</span>Ampliar</button>':''}</aside></div></section>
<div class="sinfo">${R.editing===id?metaForm(id):''}<div class="files">${unlockBtn()}${fileBtn(id,'pdf','Póster PDF','pdf')}${fileBtn(id,'posterZip','LaTeX .zip','zip')}${editBtn(id,'Editar datos')}</div></div>
${lbHTML()}`)}
async function bindMuseo(){const fr=document.getElementById('mframe');if(!fr)return;tilt(fr,document.getElementById('museo'),7);if(fr.classList.contains('empty'))return;const p=R.docs.miposter.pdf;
  const open=()=>openLBid(p.id);fr.onclick=open;fr.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};document.getElementById('mZoom').onclick=open;
  try{const [u,r]=await Promise.all([pageURL(p.id,1,1400),pageRatio(p.id,1)]);const pin=document.getElementById('mpin');if(!pin)return;fr.style.setProperty('--ar',r);pin.innerHTML=`<img src="${u}" alt="Póster">`;
    if(!matchMedia('(pointer:fine)').matches)return;const hi=await pageURL(p.id,1,2600);const lens=document.getElementById('lens');if(!lens)return;lens.style.backgroundImage=`url(${hi})`;
    fr.onpointerenter=()=>{lens.hidden=false};fr.onpointerleave=()=>{lens.hidden=true};
    fr.addEventListener('pointermove',e=>{const b=pin.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top,Z=2.6;lens.style.left=(x+14)+'px';lens.style.top=(y+14)+'px';lens.style.backgroundSize=`${b.width*Z}px ${b.height*Z}px`;lens.style.backgroundPosition=`${-(x*Z-80)}px ${-(y*Z-80)}px`})
  }catch(e){console.error('visor',e);const pin=document.getElementById('mpin');if(pin)pin.innerHTML=natPdf(R.docs.miposter&&R.docs.miposter.pdf,'80vh')}}

function bindRepo(light){const app=document.getElementById('app');app.querySelectorAll('[data-gop]').forEach(a=>a.onclick=()=>{pIdx=+a.dataset.gop;pMode='sala'});
  app.querySelectorAll('[data-get]').forEach(b=>b.onclick=()=>{const [id,f,ext]=b.dataset.get.split('|');getFile(R.docs[id][f],ext)});
  app.querySelectorAll('[data-put]').forEach(i=>i.onchange=()=>{const [id,f]=i.dataset.put.split('|');if(i.files[0])putFile(id,f,i.files[0])});
  app.querySelectorAll('[data-drop]').forEach(b=>b.onclick=()=>{const [id,f]=b.dataset.drop.split('|');if(b.dataset.sure){dropFile(id,f)}else{b.dataset.sure='1';b.textContent='¿Quitar?';setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent='✕'}},3000)}});
  app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{R.editing=b.dataset.edit;paint(true)});
  app.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{R.editing=null;paint(true)});
  app.querySelectorAll('form[data-meta]').forEach(f=>f.onsubmit=e=>{e.preventDefault();saveMeta(f.dataset.meta,f)});
  app.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{R.lang=b.dataset.lang;paint(true)});
  const ps=document.getElementById('pwset');if(ps)ps.onsubmit=e=>{e.preventDefault();const v=document.getElementById('newpw').value;if(v.length>=4)setPassword(v);else toast('Usa al menos 4 caracteres.')};
  const pc=document.getElementById('pwclear');if(pc)pc.onclick=()=>{if(pc.dataset.sure)clearPassword();else{pc.dataset.sure='1';pc.textContent='¿Seguro?'}};
  const ol=document.getElementById('openlock');if(ol)ol.onclick=openLock;
  const lf=document.getElementById('lockform');if(lf){lf.onsubmit=e=>{e.preventDefault();tryUnlock(document.getElementById('pw').value)};document.getElementById('lockcancel').onclick=()=>document.getElementById('lockdlg').hidden=true}
  app.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>selBook(+b.dataset.sp));app.querySelectorAll('[data-bk]').forEach(b=>b.onclick=()=>selBook(aSel+ +b.dataset.bk));
  app.querySelectorAll('[data-unlock]').forEach(b=>b.onclick=openLock);
  app.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>{const [id,f]=b.dataset.read.split('|');openReader(id,f)});
  const rx=document.getElementById('rdx');if(rx)rx.onclick=closeReader;
  const lb=document.getElementById('lb');if(lb){document.getElementById('lbx').onclick=closeLB;lb.onclick=e=>{if(e.target===lb)closeLB();else if(e.target.tagName==='CANVAS'||e.target.tagName==='IMG')lb.classList.toggle('zoom')}}
  if(!light){const h=location.hash;if(h==='#posters')bindPosters();else if(h==='#articulos')bindLib();else if(h==='#journal')bindJournal();else if(h==='#beamer')bindBeamer();else if(h==='#miposter')bindMuseo()}drawThumbs()}

app.innerHTML=h==='mapa'?mapView():h==='articulos'?articulos():h==='posters'?posters():OWN[h]?({journal,beamer,miposter})[h]():h==='resultados'?resultados():h==='datos'?datos():cover();if(h==='articulos'||h==='posters'||OWN[h])bindRepo();if(h==='resultados')bindRes();if(h==='datos')bindDatos();if(h==='mapa')bindMap();window.__pv=h;if(keep)window.scrollTo(0,y)}

if(document.startViewTransition&&!matchMedia('(prefers-reduced-motion: reduce)').matches)document.startViewTransition(go);else go()});
